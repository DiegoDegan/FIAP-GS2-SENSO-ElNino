<svg width="260" height="260" viewBox="0 0 260 260" aria-label="S.ENSO orbital symbol prototype" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 3D Spherical shading & glossy highlight -->
    <radialGradient id="sphereGloss" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </radialGradient>

    <!-- Linear gradient for the wave paths -->
    <linearGradient id="waveGrad" x1="0" y1="80" x2="0" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgb(222, 106, 52)" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="rgb(32, 120, 203)" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Clip path for the waves inside the planet -->
    <clipPath id="mastClip">
      <circle cx="130" cy="130" r="70"/>
    </clipPath>

    <!-- Soft drop shadow for planet depth -->
    <filter id="planetShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0b172a" flood-opacity="0.25"/>
    </filter>

    <!-- Glow effect for satellite and active elements -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      /* Smooth infinite wave animation */
      .flowing-wave {
        animation: waveFlow 8s linear infinite;
      }
      @keyframes waveFlow {
        0% { transform: translate3d(0, 0, 0); }
        100% { transform: translate3d(-112px, 0, 0); }
      }

      /* 3D Orbit motion for the satellite (placed inside the rotated groups to naturally inherit parent transforms) */
      .satellite-front-group, .satellite-back-group {
        offset-path: path('M 18 130 A 112 34 0 0 0 242 130 A 112 34 0 0 0 18 130');
        offset-rotate: 0deg;
        animation: orbitMotion 8s linear infinite;
        cursor: pointer;
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        transform-box: fill-box;
        transform-origin: center;
      }

      /* Synchronized opacity toggles to hide/show satellite as it goes behind the planet */
      .satellite-front-group {
        animation-name: orbitMotion, frontOpacity;
      }
      .satellite-back-group {
        animation-name: orbitMotion, backOpacity;
      }

      @keyframes orbitMotion {
        0% { offset-distance: 0%; }
        100% { offset-distance: 100%; }
      }

      /* Visible during the first 50% (front arc) */
      @keyframes frontOpacity {
        0%, 50% { opacity: 1; }
        50.01%, 100% { opacity: 0; }
      }

      /* Visible during the last 50% (back arc) */
      @keyframes backOpacity {
        0%, 50% { opacity: 0; }
        50.01%, 100% { opacity: 1; }
      }

      /* Hover states for interactive feel */
      .satellite-front-group:hover, .satellite-back-group:hover {
        transform: scale(1.25);
      }
      .satellite-glow {
        transition: opacity 0.4s ease, filter 0.4s ease;
        opacity: 0.4;
      }
      .satellite-front-group:hover .satellite-glow, .satellite-back-group:hover .satellite-glow {
        opacity: 0.95;
        filter: url(#glow);
      }

      /* Front orbit hover effect */
      .orbit-front {
        transition: stroke-width 0.3s ease, stroke 0.3s ease;
      }
      .orbit-front:hover {
        stroke-width: 4.5px;
        stroke: #034a81ff;
      }
    </style>
  </defs>

  <!-- 1. Back arc & Back Satellite — sweep=1, CW (bottom half of tilted ellipse), drawn before planet -->
  <g transform="rotate(-28 135 130)">
    <!-- Back orbital ring -->
    <path d="M 18 130 A 112 34 0 0 1 242 130"
          fill="none" stroke="rgba(26, 143, 191, 0.4)" stroke-width="2.5"
          stroke-dasharray="6 5" stroke-linecap="round"/>

    <!-- Satellite when behind the planet -->
    <g class="satellite-back-group">
      <!-- Outer glow aura (pulsing/revealed on hover) -->
      <circle class="satellite-glow" cx="0" cy="0" r="17" fill="none" stroke="rgba(26, 143, 191, 0.5)" stroke-width="2"/>
      <!-- Core satellite body -->
      <circle cx="0" cy="0" r="8" fill="#1A8FBF"/>
      <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    </g>
  </g>

  <!-- 2. Planet & Waves Group with Drop Shadow for 3D layering -->
  <g filter="url(#planetShadow)">
    <!-- Planet base fill -->
    <circle cx="130" cy="130" r="70" fill="#add6e6ff"/>

    <!-- 3. ENSO sinusoidal waves, clipped to planet and animated -->
    <g clip-path="url(#mastClip)">
      <g class="flowing-wave">
        <!-- Wave 1 -->
        <path d="M -57 100 Q -29 84 -1 100 Q 27 116 55 100 Q 83 84 111 100 Q 139 116 167 100 Q 195 84 223 100 Q 251 116 279 100 Q 307 84 335 100"
              fill="none" stroke="url(#waveGrad)" stroke-width="3.5" stroke-linecap="round"/>
        <!-- Wave 2 -->
        <path d="M -57 120 Q -29 104 -1 120 Q 27 136 55 120 Q 83 104 111 120 Q 139 136 167 120 Q 195 104 223 120 Q 251 136 279 120 Q 307 104 335 120"
              fill="none" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round"/>
        <!-- Wave 3 -->
        <path d="M -57 140 Q -29 124 -1 140 Q 27 156 55 140 Q 83 124 111 140 Q 139 156 167 140 Q 195 124 223 140 Q 251 156 279 140 Q 307 124 335 140"
              fill="none" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Wave 4 -->
        <path d="M -57 160 Q -29 144 -1 160 Q 27 176 55 160 Q 83 144 111 160 Q 139 176 167 160 Q 195 144 223 160 Q 251 176 279 160 Q 307 144 335 160"
              fill="none" stroke="url(#waveGrad)" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Glassmorphism overlay (gloss and shadows for 3D sphere illusion) -->
    <circle cx="130" cy="130" r="70" fill="url(#sphereGloss)" pointer-events="none"/>
  </g>

  <!-- 4. Planet rim — white for depth on dark background -->
  <circle cx="130" cy="130" r="72" fill="none" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5" pointer-events="none"/>

  <!-- 5. Front arc & Satellite — sweep=0, CCW (top half), over planet -->
  <g transform="rotate(-28 135 130)">
    <!-- Front orbital ring -->
    <path class="orbit-front" d="M 18 130 A 112 34 0 0 0 242 130"
          fill="none" stroke="#1A8FBF" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Satellite when in front of the planet -->
    <g class="satellite-front-group">
      <!-- Outer glow aura (pulsing/revealed on hover) -->
      <circle class="satellite-glow" cx="0" cy="0" r="17" fill="none" stroke="rgba(26, 143, 191, 0.5)" stroke-width="2"/>
      <!-- Core satellite body -->
      <circle cx="0" cy="0" r="8" fill="#1A8FBF"/>
      <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    </g>
  </g>
</svg>
