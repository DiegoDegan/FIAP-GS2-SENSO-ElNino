<svg width="260" height="260" viewBox="0 0 260 260" aria-label="S.ENSO orbital symbol" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 3D Spherical shading & glossy highlight -->
    <radialGradient id="sphereGloss" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </radialGradient>

    <!-- Linear gradient for the wave paths -->
    <linearGradient id="waveGrad" x1="0" y1="80" x2="0" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgb(222, 106, 52)" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="rgb(32, 120, 203)" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Clip path for the waves inside the planet -->
    <clipPath id="mastClip">
      <circle cx="130" cy="130" r="70"/>
    </clipPath>

    <!-- Soft drop shadow for planet depth -->
    <filter id="planetShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0b172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 1. Back orbital ring — drawn before planet for 3D layering -->
  <g transform="rotate(-28 135 130)">
    <path d="M 18 130 A 112 34 0 0 1 242 130"
          fill="none" stroke="rgba(26, 143, 191, 0.4)" stroke-width="2.5"
          stroke-dasharray="6 5" stroke-linecap="round"/>
  </g>

  <!-- 2. Planet & Waves Group with Drop Shadow for 3D layering -->
  <g filter="url(#planetShadow)">
    <!-- Planet base fill -->
    <circle cx="130" cy="130" r="70" fill="#29548fff"/>

    <!-- 3. ENSO sinusoidal waves, clipped to planet, frozen at rest position -->
    <g clip-path="url(#mastClip)">
      <!-- Wave 1 -->
      <path d="M -57 100 Q -29 84 -1 100 Q 27 116 55 100 Q 83 84 111 100 Q 139 116 167 100 Q 195 84 223 100 Q 251 116 279 100 Q 307 84 335 100"
            fill="none" stroke="url(#waveGrad)" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Wave 2 -->
      <path d="M -57 120 Q -29 104 -1 120 Q 27 136 55 120 Q 83 104 111 120 Q 139 136 167 120 Q 195 104 223 120 Q 251 136 279 120 Q 307 104 335 120"
            fill="none" stroke="url(#waveGrad)" stroke-width="3" stroke-linecap="round"/>
      <!-- Wave 3 -->
      <path d="M -57 140 Q -29 124 -1 140 Q 27 156 55 140 Q 83 124 111 140 Q 139 156 167 140 Q 195 124 223 140 Q 251 156 279 140 Q 307 124 335 140"
            fill="none" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Wave 4 -->
      <path d="M -57 160 Q -29 144 -1 160 Q 27 176 55 160 Q 83 144 111 160 Q 139 176 167 160 Q 195 144 223 160 Q 251 176 279 160 Q 307 144 335 160"
            fill="none" stroke="url(#waveGrad)" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Glassmorphism overlay (gloss and shadows for 3D sphere illusion) -->
    <circle cx="130" cy="130" r="70" fill="url(#sphereGloss)" pointer-events="none"/>
  </g>

  <!-- 4. Planet rim — white for depth on dark background -->
  <circle cx="130" cy="130" r="72" fill="none" stroke="rgba(255, 255, 255, 0.18)" stroke-width="1.5" pointer-events="none"/>

  <!-- 5. Front orbital ring & Satellite — over planet, satellite resting near the ring's right edge -->
  <g transform="rotate(-28 135 130)">
    <path d="M 18 130 A 112 34 0 0 0 242 130"
          fill="none" stroke="#1A8FBF" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Satellite: on the ellipse at θ≈-40° from right → (216,108) -->
    <g transform="translate(216 108)">
      <circle r="17" fill="none" stroke="rgba(26, 143, 191, 0.5)" stroke-width="2" opacity="0.4"/>
      <circle r="8" fill="#1A8FBF"/>
      <circle r="4" fill="#ffffff"/>
    </g>
  </g>
</svg>
